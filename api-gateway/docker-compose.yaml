

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - zipkin
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ZIPKIN_URI=http://zipkin:9411/api/v2/spans
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL:-http://host.docker.internal:8761/eureka/}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped