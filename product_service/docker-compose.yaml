

services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin-product
    ports:
      - "9411:9411"
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    depends_on:
      - zipkin
    environment:
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL:-http://host.docker.internal:8761/eureka/}
      - ZIPKIN_URI=http://zipkin:9411/api/v2/spans
      - MYSQL_URL=${MYSQL_URL:-jdbc:mysql://host.docker.internal:3306/product_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped